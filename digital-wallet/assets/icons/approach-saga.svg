<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- approach-saga: linear forward transaction chain with compensating return arrow -->
  <!-- Forward chain -->
  <rect x="6" y="14" width="14" height="14" rx="2" stroke="#1C2B4A" stroke-width="1.8" fill="#FBFBF8"/>
  <circle cx="13" cy="21" r="2" fill="#1C2B4A"/>

  <path d="M20 21 H26" stroke="#1C2B4A" stroke-width="2"/>
  <polygon points="25,18 29,21 25,24" fill="#1C2B4A"/>

  <rect x="29" y="14" width="14" height="14" rx="2" stroke="#1C2B4A" stroke-width="1.8" fill="#FBFBF8"/>
  <circle cx="36" cy="21" r="2" fill="#1C2B4A"/>

  <path d="M43 21 H49" stroke="#1C2B4A" stroke-width="2"/>
  <polygon points="48,18 52,21 48,24" fill="#1C2B4A"/>

  <rect x="52" y="14" width="6" height="14" rx="1" stroke="#1C2B4A" stroke-width="1.8" fill="#FBFBF8"/>

  <!-- Failure marker on step 2/3 -->
  <circle cx="48" cy="21" r="4" fill="#C9472B"/>
  <path d="M46 19 L50 23 M50 19 L46 23" stroke="#FBFBF8" stroke-width="1.2"/>

  <!-- Compensating reverse arrow (fail accent, dashed) -->
  <path d="M48 30 V38 C48 44 40 44 36 44 H16" stroke="#C9472B" stroke-width="2" stroke-dasharray="3 2" stroke-linecap="round"/>
  <polygon points="18,41 12,44 18,47" fill="#C9472B"/>

  <!-- Compensation step box below -->
  <rect x="18" y="38" width="12" height="12" rx="2" stroke="#C9472B" stroke-width="1.5" fill="#F6DED5"/>
  <text x="24" y="47" font-family="IBM Plex Sans, sans-serif" font-size="7" font-weight="700" fill="#C9472B" text-anchor="middle">C</text>
</svg>
