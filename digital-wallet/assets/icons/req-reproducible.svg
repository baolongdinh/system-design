<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- req-reproducible: rewind/replay arrow over immutable log strip -->
  <!-- Event log strip -->
  <rect x="6" y="36" width="52" height="18" rx="2" stroke="#1C2B4A" stroke-width="2" fill="#FBFBF8"/>
  <!-- Cell partitions -->
  <line x1="19" y1="36" x2="19" y2="54" stroke="#1C2B4A" stroke-width="1.5"/>
  <line x1="32" y1="36" x2="32" y2="54" stroke="#1C2B4A" stroke-width="1.5"/>
  <line x1="45" y1="36" x2="45" y2="54" stroke="#1C2B4A" stroke-width="1.5"/>
  <!-- Ochre left band indicating events -->
  <rect x="6" y="36" width="4" height="18" fill="#A8741A"/>

  <!-- Rewind / replay arrow in ochre accent -->
  <path d="M48 24 C44 14 24 14 16 22" stroke="#A8741A" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="14,14 13,24 23,21" fill="#A8741A"/>

  <!-- Rewind triangle symbols -->
  <polygon points="36,22 36,30 30,26" fill="#1C2B4A"/>
  <polygon points="42,22 42,30 36,26" fill="#1C2B4A"/>
</svg>
