<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- req-throughput: speedometer / throughput gauge -->
  <!-- Gauge outer arc -->
  <path d="M14 44 A24 24 0 1 1 50 44" stroke="#1C2B4A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Inner scale arc (dashed) -->
  <path d="M19 41 A18 18 0 1 1 45 41" stroke="#8A93A6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Ticks -->
  <line x1="14" y1="44" x2="18" y2="41" stroke="#1C2B4A" stroke-width="2"/>
  <line x1="16" y1="24" x2="20" y2="26" stroke="#1C2B4A" stroke-width="2"/>
  <line x1="32" y1="12" x2="32" y2="17" stroke="#1C2B4A" stroke-width="2"/>
  <line x1="48" y1="24" x2="44" y2="26" stroke="#1C2B4A" stroke-width="2"/>
  <line x1="50" y1="44" x2="46" y2="41" stroke="#1C2B4A" stroke-width="2"/>
  <!-- Base hub -->
  <circle cx="32" cy="42" r="5" fill="#1C2B4A"/>
  <!-- High throughput needle in green ok accent pointing to top-right -->
  <line x1="32" y1="42" x2="46" y2="22" stroke="#3F7D5A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="46" cy="22" r="2" fill="#3F7D5A"/>
  <!-- Base bar -->
  <line x1="10" y1="52" x2="54" y2="52" stroke="#4B5A75" stroke-width="1.5" stroke-linecap="round"/>
</svg>
