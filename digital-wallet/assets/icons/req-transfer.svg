<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- req-transfer: two wallets with transfer arrow -->
  <!-- Left wallet -->
  <rect x="6" y="22" width="22" height="28" rx="4" stroke="#1C2B4A" stroke-width="2" fill="#FBFBF8"/>
  <path d="M6 30H28" stroke="#1C2B4A" stroke-width="2"/>
  <path d="M20 37H28V43H20C18.3431 43 17 41.6569 17 40C17 38.3431 18.3431 37 20 37Z" stroke="#1C2B4A" stroke-width="1.5" fill="#E8EAE2"/>
  <circle cx="23" cy="40" r="1.5" fill="#1C2B4A"/>

  <!-- Right wallet -->
  <rect x="36" y="22" width="22" height="28" rx="4" stroke="#1C2B4A" stroke-width="2" fill="#FBFBF8"/>
  <path d="M36 30H58" stroke="#1C2B4A" stroke-width="2"/>
  <path d="M50 37H58V43H50C48.3431 43 47 41.6569 47 40C47 38.3431 48.3431 37 50 37Z" stroke="#1C2B4A" stroke-width="1.5" fill="#E8EAE2"/>
  <circle cx="53" cy="40" r="1.5" fill="#1C2B4A"/>

  <!-- Transfer arrow with slate-blue command accent -->
  <path d="M20 16C24 10 40 10 44 16" stroke="#3E5C9A" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="41,12 47,17 40,19" fill="#3E5C9A"/>
  <!-- Coin symbol accent -->
  <circle cx="32" cy="11" r="4.5" fill="#FBFBF8" stroke="#3E5C9A" stroke-width="1.5"/>
</svg>
