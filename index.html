<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Design Slides</title>
<style>
  :root { --bg:#fafaf7; --ink:#1b1b1a; --ink-2:#5d5d58; --line:#e3e2dc; --card:#fff; --accent:#2f5bd3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --ink:#ececE8; --ink-2:#a3a39c; --line:#2c2c2a; --card:#1d1d1c; --accent:#8aa8ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:64px 16px; }
  h1 { font-size:2rem; margin:0 0 .25rem; letter-spacing:-.01em; }
  p.lead { color:var(--ink-2); margin:0 0 2.5rem; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:12px; }
  a.topic { display:block; padding:18px 20px; background:var(--card); border:1px solid var(--line); border-radius:10px; color:inherit; text-decoration:none; }
  a.topic:hover { border-color:var(--accent); }
  a.topic strong { display:block; font-size:1.1rem; }
  a.topic span { color:var(--ink-2); font-size:.95rem; }
</style>
</head>
<body>
<main>
  <h1>System Design Slides</h1>
  <p class="lead">Bộ slide dùng để giảng dạy và trình bày. Chọn một topic để mở.</p>
  <ul>
    <li><a class="topic" href="digital-wallet/"><strong>Digital Wallet at Scale</strong><span>23 slide · 2PC, TC/C, Saga, event sourcing, CQRS, Raft, partition</span></a></li>
  </ul>
</main>
</body>
</html>
